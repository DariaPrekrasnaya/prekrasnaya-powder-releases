<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530"><rect width="1100" height="530" rx="24" fill="#f6f1f8"/><g font-family="Arial,sans-serif"><text x="40" y="55" font-size="26" fill="#35273f">Где найти меню пудреницы</text><text x="40" y="90" font-size="16" fill="#796783">Схема расположения. Вид системной панели может отличаться.</text><rect x="40" y="120" width="490" height="310" rx="16" fill="#e6dcea"/><text x="62" y="155" font-size="21" fill="#35273f">Windows · справа внизу</text><rect x="40" y="370" width="490" height="60" rx="12" fill="#28232e"/><text x="465" y="407" fill="#eee6f4" font-size="18">12:00</text><path d="M302 405 L312 395 L322 405" fill="none" stroke="#d8f6df" stroke-width="3"/><rect x="277" y="204" width="145" height="143" rx="16" fill="#352d3f"/><circle cx="350" cy="262" r="27" fill="#80588f" stroke="#cab1d8" stroke-width="3"/><path d="M350 245 L355 257 L367 262 L355 267 L350 279 L345 267 L333 262 L345 257Z" fill="#d4efda"/><text x="300" y="318" fill="#eee6f4" font-size="15">Пудреница</text><path d="M312 380 V353" stroke="#8b649e" stroke-width="3"/><text x="62" y="227" fill="#35273f" font-size="17">1. Нажми стрелку ↑</text><text x="62" y="257" fill="#35273f" font-size="17">2. Найди значок</text><text x="62" y="287" fill="#35273f" font-size="17">3. Нажми левой</text><text x="83" y="312" fill="#35273f" font-size="17">кнопкой мыши</text><rect x="570" y="120" width="490" height="310" rx="16" fill="#e6dcea"/><rect x="570" y="120" width="490" height="46" rx="12" fill="#28232e"/><text x="590" y="150" fill="#eee6f4" font-size="18">●</text><circle cx="959" cy="143" r="13" fill="#80588f" stroke="#cab1d8" stroke-width="2"/><path d="M959 135 L962 140 L967 143 L962 146 L959 151 L956 146 L951 143 L956 140Z" fill="#d4efda"/><text x="995" y="150" fill="#eee6f4" font-size="15">12:00</text><path d="M959 184 V164" stroke="#8b649e" stroke-width="3"/><text x="595" y="232" font-size="21" fill="#35273f">Mac · справа вверху</text><text x="595" y="279" font-size="18" fill="#35273f">Нажми значок пудреницы</text><text x="595" y="310" font-size="18" fill="#35273f">в верхней строке меню.</text><text x="40" y="479" fill="#35273f" font-size="19">Не видишь значок? Сначала запусти Prekrasnaya Powder.</text></g></svg>